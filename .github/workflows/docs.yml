name: Deploy mdBook Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Install mdBook
        run: cargo +stable install mdbook --version 0.5.4 --locked
      - name: Build and test documentation
        run: |
          cargo +stable test --workspace --doc --all-features
          RUSTDOCFLAGS="-D warnings" cargo +stable doc --workspace --all-features --no-deps
          mdbook test docs
          mdbook build docs
          mkdir -p target/mdbook/api
          cp -R target/doc/. target/mdbook/api/
      - name: Check rendered documentation links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline
            --scheme file
            --index-files index.html,.
            'target/mdbook/**/*.html'
          fail: true
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/mdbook

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
