name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }}, Rust ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            toolchain: "1.85.0"
          - os: ubuntu-latest
            toolchain: stable
          - os: macos-latest
            toolchain: stable
          - os: windows-latest
            toolchain: stable
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install ${{ matrix.toolchain }} --profile minimal
          rustup component add --toolchain ${{ matrix.toolchain }} clippy rustfmt
          rustc +${{ matrix.toolchain }} --version
          cargo +${{ matrix.toolchain }} --version
      - name: Run tests
        run: cargo +${{ matrix.toolchain }} test --workspace --lib --tests --examples --all-features

  lint:
    name: Format and Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add --toolchain stable clippy rustfmt
      - name: Check formatting
        run: cargo +stable fmt --all -- --check
      - name: Run Clippy
        run: cargo +stable clippy --workspace --all-targets --all-features -- -D warnings

  release:
    name: Release build and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Build release
        run: cargo +stable build --workspace --release --locked
      - name: Verify package layout
        run: cargo +stable package --workspace --locked

  benchmarks:
    name: Benchmark compilation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Compile benchmark target
        run: cargo +stable bench -p specification-core --bench dispatch --no-run --locked

  indexed-performance:
    name: Indexed decision performance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Run Release parity-checked catalog benchmark
        shell: bash
        run: |
          mkdir -p target/benchmark-artifacts
          rustc +stable --version > target/benchmark-artifacts/environment.txt
          git rev-parse HEAD >> target/benchmark-artifacts/environment.txt
          cargo +stable bench -p specification-core --bench indexed_decisions --locked \
            > target/benchmark-artifacts/indexed-decisions.csv \
            2> target/benchmark-artifacts/indexed-decisions.log
      - name: Validate samples and catalog scaling
        run: |
          python3 scripts/test_indexed_performance_report.py
          python3 scripts/check_indexed_performance.py target/benchmark-artifacts/indexed-decisions.csv
      - name: Publish raw benchmark samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indexed-performance-${{ matrix.os }}
          path: target/benchmark-artifacts/
          if-no-files-found: error
          retention-days: 14

  keyed-static-performance:
    name: Keyed static decision performance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustc +stable --version
          cargo +stable --version
      - name: Run Release parity-checked macro benchmark
        shell: bash
        run: |
          mkdir -p target/benchmark-artifacts
          {
            echo "os=${{ matrix.os }}"
            echo "commit=$(git rev-parse HEAD)"
            echo "rustc=$(rustc +stable --version)"
            echo "cargo=$(cargo +stable --version)"
            if [[ -n "$(git status --porcelain)" ]]; then
              echo "working_tree_dirty=true"
            else
              echo "working_tree_dirty=false"
            fi
            echo "harness_sha256=$(shasum -a 256 crates/specification-core-macros/benches/static_decisions.rs | cut -d ' ' -f 1)"
          } > target/benchmark-artifacts/environment.txt
          cargo +stable bench -p specification-core-macros --bench static_decisions --locked \
            > target/benchmark-artifacts/static-decisions.csv \
            2> target/benchmark-artifacts/static-decisions.log
      - name: Validate samples and keyed scaling
        shell: bash
        run: |
          python3 scripts/test_static_performance_report.py
          python3 scripts/check_static_performance.py target/benchmark-artifacts/static-decisions.csv
      - name: Publish raw benchmark samples and environment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keyed-static-performance-${{ matrix.os }}
          path: target/benchmark-artifacts/
          if-no-files-found: error
          retention-days: 14

  docs:
    name: Documentation and doctests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Install mdBook
        run: cargo +stable install mdbook --version 0.5.4 --locked
      - name: Run doctests
        run: cargo +stable test --workspace --doc --all-features
      - name: Build rustdoc
        run: RUSTDOCFLAGS="-D warnings" cargo +stable doc --workspace --all-features --no-deps
      - name: Build and test mdBook
        run: |
          mdbook test docs
          mdbook build docs

  coverage:
    name: Coverage measurement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust and LLVM tools
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add --toolchain stable llvm-tools-preview
      - name: Install cargo-llvm-cov
        run: cargo +stable install cargo-llvm-cov --locked
      - name: Measure coverage
        run: cargo +stable llvm-cov --workspace --all-features --fail-under-lines 90

  miri:
    name: Miri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly Miri
        run: |
          rustup toolchain install nightly --profile minimal
          rustup component add --toolchain nightly miri
      - name: Run Miri tests
        run: |
          cargo +nightly miri setup
          cargo +nightly miri test --workspace --lib --tests --examples --all-features
